<div class="wrap">
  <div class="page-head">
    <div><h1 id="heading"></h1><p class="sub">Import supports .txt, .md and .docx files up to 2 MB.</p></div>
    <div class="tools">
      <div class="search-box"><svg class="i" width="16" height="16" aria-hidden="true"><use href="/icons.svg#search"/></svg>
        <input class="search" id="q" type="search" placeholder="Search documents" aria-label="Search documents"></div>
      <label class="btn"><svg class="i" width="16" height="16" aria-hidden="true"><use href="/icons.svg#upload"/></svg>Import file<input id="file" type="file" accept=".txt,.md,.docx" hidden></label>
    </div>
  </div>

  <div class="table">
  <div class="row-i head" id="head">
  <span>Name</span>
  <span class="col-o">Owner</span>
  <span>Access</span>
  <span class="col-e">Last modified</span>
  <span class="sr">Actions</span>
</div>
    <div id="rows"></div>
  </div>
</div>

<template id="row">
  <div class="row-i">
    <a class="doc"><span class="ico"><svg class="i" width="18" height="18" aria-hidden="true"><use href="/icons.svg#doc"/></svg></span><b></b></a>
    <span class="own col-o"><span class="own-av"></span><span class="own-name"></span></span>
    <span class="badge"></span>
    <span class="muted col-e"></span>
    <span class="acts">
      <button class="btn sm" data-act="rename">Rename</button>
      <button class="btn sm danger" data-act="delete">Delete</button>
    </span>
  </div>
</template>

<template id="empty">
  <div class="empty">
    <span class="empty-ico"><svg class="i" width="18" height="18" aria-hidden="true"><use href="/icons.svg#doc"/></svg></span>
    <h2></h2><p></p>
    <div class="row center">
      <button class="btn primary" data-act="new"><svg class="i" width="16" height="16" aria-hidden="true"><use href="/icons.svg#plus"/></svg>New document</button>
      <button class="btn" data-act="import"><svg class="i" width="16" height="16" aria-hidden="true"><use href="/icons.svg#upload"/></svg>Import file</button>
    </div>
  </div>
</template>

<template id="rename-dlg">
  <h1>Rename document</h1>
  <form class="dlg-form">
    <input maxlength="120" aria-label="Document title" required>
    <div class="dlg-actions"><button type="button" class="btn cancel">Cancel</button><button class="btn primary ok">Save</button></div>
  </form>
</template>

<template id="delete-dlg">
  <h1></h1>
  <p class="sub">This also removes access for everyone it's shared with. It can't be undone.</p>
  <div class="dlg-actions"><button class="btn cancel">Cancel</button><button class="btn danger-fill ok">Delete document</button></div>
</template>
