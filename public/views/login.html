<div class="login">
  <aside class="login-art" aria-hidden="true">
    <span class="brand"><img class="logo" src="/logo.png" alt="" onerror="this.remove()"><span class="brand-name">Ajaia Docs</span></span>

    <div class="mock">
      <div class="card back"></div>
      <div class="card front">
        <span class="ln h"></span>
        <span class="ln" style="width:92%"></span>
        <span class="ln" style="width:78%"></span>
        <span class="ln" style="width:86%"></span>
        <span class="ln" style="width:40%"></span>
        <span class="ln" style="width:90%;margin-top:10px"></span>
        <span class="ln" style="width:64%"></span>
        <span class="flag" style="--c:#7c3aed;left:176px;top:96px">Bob</span>
        <span class="flag" style="--c:#0f766e;left:84px;top:178px">Carol</span>
      </div>
      <span class="chip"><i></i>All changes saved</span>
    </div>

    <div class="art-copy">
      <h2>Documents,<br><em>written together.</em></h2>
      <p>One place to draft, review and share your team's work, with the right people and nobody else.</p>
    </div>
  </aside>

  <section class="login-pane">
    <div class="login-box">
      <span class="brand login-brand"><img class="logo" src="/logo.png" alt="" onerror="this.remove()"><span class="brand-name">Ajaia Docs</span></span>
      <h1 id="heading"></h1>
      <p class="sub" id="sub"></p>

      <form id="auth" class="stack" novalidate>
        <label class="fld" id="name-fld" hidden><span>Full name</span>
          <input name="name" autocomplete="name" maxlength="80" placeholder="Jane Doe" required></label>
        <label class="fld"><span>Email</span>
          <input name="email" type="email" autocomplete="email" placeholder="you@company.com" required></label>
        <label class="fld"><span id="pw-label">Password</span>
          <span class="pw">
            <input name="password" type="password" placeholder="Enter your password" required>
            <button class="reveal" id="reveal" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6A17 17 0 002 12s3.6 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
            </button>
          </span></label>
        <p class="err" id="err" role="alert" hidden></p>
        <button class="btn primary block" id="go"></button>
      </form>

      <p class="fine"><span id="switch-text"></span> <a href="#" id="sw"></a></p>
    </div>
  </section>
</div>
